# Ağ gerektirmeyen kontroller: Rails API testleri (fixture model) + mobil typecheck.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rails-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails-api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: rails-api
          bundler-cache: true
      - run: bin/rails test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
